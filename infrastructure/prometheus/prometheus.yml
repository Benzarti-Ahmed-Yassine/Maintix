global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'rag-server'
    static_configs:
      - targets: ['rag-server:8100']

  - job_name: 'mcp-server'
    static_configs:
      - targets: ['mcp-server:8200']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

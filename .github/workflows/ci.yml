name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install pytest pytest-asyncio httpx fastapi pytest-cov
          pip install -e apps/ai-platform -e apps/mcp-server -e apps/rag-server -e apps/integration
      - name: Run Python tests
        run: pytest --cov=apps/backend --cov=apps/ai-platform --cov=apps/mcp-server --cov=apps/rag-server --cov=apps/integration --cov-report=xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm run test -- --coverage

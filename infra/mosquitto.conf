# Configuration Mosquitto MQTT pour MAINTIX
# Fichier: infra/mosquitto.conf

# ─ Listener ───────────────────────────────────────────────────
listener 1883
listener 9001
protocol websockets

# ─ Sécurité (mode dev : accès anonyme autorisé) ───────────────
allow_anonymous true

# ─ Persistence ───────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─ Logs ──────────────────────────────────────────────────────
log_dest stdout
log_type all

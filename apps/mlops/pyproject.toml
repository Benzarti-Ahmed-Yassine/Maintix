[project]
name = "maintix-mlops"
version = "0.1.0"
description = "Maintix MLOps implementation with MLflow, training, evaluation, model registry, deployment, monitoring, drift detection, and retraining"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=2.5.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.25.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0"
]

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

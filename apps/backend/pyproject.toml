[project]
name = "maintix-backend"
version = "0.1.0"
description = "Maintix backend architecture scaffold"
dependencies = [
    "fastapi>=0.105.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic>=2.9.0",
    "email-validator>=2.0.0",
    "python-jose>=3.1.0",
    "passlib[bcrypt]>=1.7.0",
    "redis>=5.0.0",
    "paho-mqtt>=1.6.1",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.28.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "watchfiles>=0.20.0"
]

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"
